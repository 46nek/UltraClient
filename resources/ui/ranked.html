<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranked Matchmaker</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #121212; color: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        .kuc-title { font-size: 28px; font-weight: bold; margin-bottom: 30px; color: #f97316; letter-spacing: 2px;}
        .kuc-btn {
            background: #ea580c; color: white; border: none; padding: 15px 50px;
            font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4);
        }
        .kuc-btn:hover { background: #f97316; transform: translateY(-2px); }
        .kuc-btn:active { transform: translateY(0); }
        
        .kuc-status { margin-top: 20px; font-size: 16px; color: #a1a1aa; font-weight: 500; }
        .kuc-timer { font-size: 54px; font-family: monospace; margin-top: 10px; color: #fff; font-weight: bold; }
        
        .region-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .region-btn {
            background: #27272a;
            color: #a1a1aa;
            border: 2px solid #3f3f46;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        
        .region-btn:hover {
            border-color: #52525b;
            color: #d4d4d8;
        }
        
        .region-btn.active {
            background: rgba(234, 88, 12, 0.1);
            border-color: #ea580c;
            color: #ea580c;
        }
        
    </style>
</head>
<body>
    <div class="kuc-title">RANKED MATCHMAKER</div>
    
    <div class="region-btns">
        <button class="region-btn active" data-region="na">NA</button>
        <button class="region-btn" data-region="eu">EU</button>
        <button class="region-btn" data-region="as">AS</button>
    </div>
    
    <button class="kuc-btn" id="findMatchBtn">FIND MATCH</button>
    <div class="kuc-status" id="statusText">Status: Idle</div>
    <div class="kuc-timer" id="timerDisplay">00:00:00</div>
    <div id="kuc-match-status" style="display:none; margin-top: 15px; color: #5ce05a; text-align: center;"></div>

    <script>
        let ws = null;
        let timerInterval = null;
        let isQueued = false;
        let token = null;
        let selectedRegion = 'na';
        let elapsedTime = 0;
        
        const mapIds = [2, 4, 11, 14, 17, 0, 39]; 
        
        const regionBtns = document.querySelectorAll('.region-btn');
        const findMatchBtn = document.getElementById('findMatchBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const statusText = document.getElementById('statusText');
        const kucMatchStatus = document.getElementById('kuc-match-status');
        
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                osc.start();
                setTimeout(() => osc.stop(), 500);
            } catch(e) {}
        }
        
        regionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isQueued) return;
                regionBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRegion = btn.dataset.region;
            });
        });
        
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }
        
        function updateTimer() {
            elapsedTime++;
            timerDisplay.textContent = formatTime(elapsedTime);
        }
        
        function startWebSocketQueue() {
            statusText.textContent = 'Status: Connecting to Matchmaking...';
            const wsUrl = `wss://gamefrontend.svc.krunker.io/v1/matchmaking/queue?token=${token}&maps=${mapIds.join(",")}&regions=${selectedRegion}`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    isQueued = true;
                    statusText.textContent = 'Status: IN QUEUE';
                    statusText.style.color = '#ea580c';
                    findMatchBtn.textContent = 'CANCEL';
                    findMatchBtn.style.background = '#e11d48';
                    findMatchBtn.disabled = false;
                    
                    elapsedTime = 0;
                    timerDisplay.textContent = "00:00:00";
                    timerInterval = setInterval(updateTimer, 1000);
                    kucMatchStatus.style.display = 'none';
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'QUEUE_STATUS') {
                            if (data.payload && data.payload.status === 'MATCHED') {
                                // 1. Play sound natively via C++
                                window.chrome.webview.postMessage(JSON.stringify({ type: 'playBeep' }));
                                
                                // 2. Tell Main Window to reload/handle rejoin
                                window.chrome.webview.postMessage(JSON.stringify({
                                    type: 'forwardIpcToMain',
                                    action: 'matchFound',
                                    payload: data.payload
                                }));
                                
                                statusText.textContent = 'Status: MATCH FOUND!';
                                statusText.style.color = '#5ce05a';
                                kucMatchStatus.innerHTML = 'Match Found!<br>The main client should update to show Rejoin shortly.';
                                kucMatchStatus.style.display = 'block';
                                
                                clearInterval(timerInterval);
                                isQueued = false;
                                findMatchBtn.textContent = 'FIND MATCH';
                                findMatchBtn.style.background = '#ea580c';
                                
                                // 3. Reset UI after 20 seconds
                                setTimeout(() => {
                                    resetUI();
                                    statusText.textContent = 'Status: Idle';
                                    kucMatchStatus.style.display = 'none';
                                }, 20000);
                            }
                        } else if (data.type === 'ERROR') {
                            if (data.payload && data.payload.code === 'COOLDOWN') {
                                statusText.textContent = 'Status: Cooldown active. Try again later.';
                                resetUI();
                            } else {
                                statusText.textContent = 'Status: Error - ' + (data.payload ? data.payload.code : 'Unknown');
                                resetUI();
                            }
                        } else if (data.type === 'INTERNAL_ERROR') {
                            statusText.textContent = 'Status: Server Internal Error';
                            resetUI();
                        }
                    } catch(e) {}
                };
                
                ws.onerror = (e) => {
                    statusText.textContent = 'Status: Connection failed';
                    resetUI();
                };
                
                ws.onclose = () => {
                    if (isQueued) {
                        statusText.textContent = 'Status: Disconnected';
                        resetUI();
                    }
                };
            } catch(e) {
                statusText.textContent = 'Status: WebSocket creation error';
                resetUI();
            }
        }
        
        function resetUI() {
            isQueued = false;
            clearInterval(timerInterval);
            timerDisplay.textContent = "00:00:00";
            findMatchBtn.textContent = 'FIND MATCH';
            findMatchBtn.style.background = '#ea580c';
            findMatchBtn.disabled = false;
            statusText.style.color = '#a1a1aa';
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        findMatchBtn.addEventListener('click', () => {
            if (isQueued) {
                if (ws) {
                    ws.close();
                    ws = null;
                }
                resetUI();
                statusText.textContent = 'Status: Canceled';
            } else {
                statusText.textContent = 'Status: Fetching Token...';
                findMatchBtn.disabled = true;
                window.chrome.webview.postMessage(JSON.stringify({
                    type: 'forwardIpcToMain',
                    action: 'getRankedToken'
                }));
            }
        });
        
        window.chrome.webview.addEventListener('message', (event) => {
            try {
                let msg = event.data;
                if (typeof msg === 'string') msg = JSON.parse(msg);
                
                if (msg.action === 'rankedTokenResponse') {
                    token = msg.token;
                    startWebSocketQueue();
                } 
                else if (msg.action === 'rankedMatchError') {
                    statusText.textContent = 'Status: ' + msg.message;
                    resetUI();
                }
            } catch(e) {}
        });
        
    </script>
</body>
</html>
